<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI建模导航员</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --bg: #f7f8fa;
      --panel: #ffffff;
      --line: #e5e7eb;
      --muted: #6b7280;
      --faint: #9ca3af;
      --text: #1f2937;
      --brand: #667eea;
      --brand-hover: #5568d3;
      --blue: #3b82f6;
      --green: #10b981;
      --yellow: #f59e0b;
      --purple: #8b5cf6;
      --radius: 8px;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    button, input { font: inherit; }
    button {
      border: none;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s, background 0.2s, border-color 0.2s;
    }
    button:hover { opacity: 0.9; }
    button:active { transform: scale(0.98); }
    svg { display: block; flex-shrink: 0; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }

    .app {
      display: flex;
      height: 100vh;
      background: var(--bg);
    }

    .sidebar {
      width: 240px;
      background: var(--panel);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .logo {
      padding: 20px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-mark,
    .avatar {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-weight: 600;
    }

    .logo-mark {
      width: 32px;
      height: 32px;
      border-radius: 8px;
    }

    .logo-text {
      font-size: 16px;
      font-weight: 600;
    }

    .new-chat-wrap { padding: 16px; }
    .primary-button {
      padding: 10px 20px;
      background: var(--brand);
      color: #ffffff;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .primary-button:hover { background: var(--brand-hover); }
    .full-button { width: 100%; padding: 12px; }
    .ghost-button {
      padding: 8px 12px;
      background: #f3f4f6;
      color: #4b5563;
      border-radius: 6px;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .icon-button {
      padding: 8px;
      background: #f3f4f6;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .project-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 12px;
    }

    .section-label {
      font-size: 12px;
      color: var(--faint);
      padding: 12px 8px 8px;
      font-weight: 500;
    }

    .chat-item {
      padding: 10px 12px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }
    .chat-item:hover { background: #f9fafb; }
    .chat-item.active { background: #f3f4f6; }
    .chat-name {
      flex: 1;
      min-width: 0;
      font-size: 14px;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .chat-item.active .chat-name { font-weight: 500; }

    .user-footer {
      padding: 16px;
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 14px;
    }
    .user-name {
      font-size: 14px;
      font-weight: 500;
    }
    .user-role {
      font-size: 12px;
      color: var(--muted);
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      overflow: hidden;
      min-width: 0;
    }

    .topbar {
      padding: 16px 24px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-shrink: 0;
    }
    .topbar h2 {
      font-size: 16px;
      font-weight: 600;
      margin: 0 0 4px 0;
    }
    .topbar p {
      font-size: 13px;
      color: var(--muted);
      margin: 0;
    }
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      background: #ffffff;
    }
    .content-inner {
      max-width: 1200px;
      margin: 0 auto;
    }

    .agent-header {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }
    .agent-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: #1f2937;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .agent-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .agent-subtitle {
      font-size: 13px;
      color: var(--muted);
    }

    .steps-card {
      background: linear-gradient(180deg, #fbfcff 0%, #f7f9fd 100%);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 20px;
      border: 1px solid #e7ebf3;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.04);
    }
    .steps-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }
    .steps-kicker {
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .steps-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }
    .steps-note {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }
    .steps-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .steps-grid {
      position: relative;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 14px;
      width: 100%;
    }
    .steps-grid::before {
      content: "";
      position: absolute;
      left: 10%;
      right: 10%;
      top: 20px;
      height: 2px;
      background: #dde3ef;
      z-index: 0;
    }
    .step-node {
      position: relative;
      z-index: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
      background: rgba(255, 255, 255, 0.92);
      transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;
      text-align: left;
    }
    .step-node.disabled {
      background: rgba(248, 250, 252, 0.95);
      border-color: #edf2f7;
    }
    .step-node.current {
      border-color: rgba(102, 126, 234, 0.28);
      box-shadow: 0 8px 24px rgba(102, 126, 234, 0.12);
    }
    .step-node.done {
      background: linear-gradient(180deg, #ffffff 0%, #f3fff8 100%);
      border-color: #bbf7d0;
    }
    .step-head {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .step-icon-box {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s;
      flex-shrink: 0;
    }
    .step-icon-box.active { background: var(--brand); }
    .step-icon-box.done { background: var(--green); }
    .step-copy {
      min-width: 0;
      flex: 1;
    }
    .step-index {
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .step-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }
    .step-label.active {
      color: var(--brand);
    }
    .step-desc {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.45;
    }
    .step-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: auto;
    }
    .step-percent {
      font-size: 11px;
      font-weight: 700;
      color: #475569;
    }
    .step-status {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }
    .progress {
      width: 100%;
      height: 6px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea 0%, #10b981 100%);
      transition: width 0.5s ease;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid transparent;
      white-space: nowrap;
    }
    .status-badge.pending {
      background: #f8fafc;
      color: #64748b;
      border-color: #e5e7eb;
    }
    .status-badge.process {
      background: #eff6ff;
      color: #1e40af;
      border-color: #bfdbfe;
    }
    .status-badge.success {
      background: #f0fdf4;
      color: #166534;
      border-color: #bbf7d0;
    }
    .phase-banner {
      padding: 16px 18px;
      border: 1px solid #e7ebf3;
      border-radius: 14px;
      background: linear-gradient(135deg, #f8fbff 0%, #ffffff 58%, #f5fff8 100%);
      margin-bottom: 16px;
    }
    .phase-banner-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }
    .phase-banner-kicker {
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .phase-banner-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }
    .phase-banner-desc {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.6;
      max-width: 680px;
    }
    .phase-banner-percent {
      min-width: 92px;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(102, 126, 234, 0.18);
      text-align: right;
      box-shadow: 0 8px 18px rgba(99, 102, 241, 0.08);
    }
    .phase-banner-percent strong {
      display: block;
      font-size: 24px;
      line-height: 1;
      margin-bottom: 4px;
      color: var(--text);
    }
    .phase-banner-percent span {
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .phase-metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }
    .phase-metric {
      padding: 12px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid #e5e7eb;
    }
    .phase-metric-label {
      font-size: 11px;
      color: var(--faint);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }
    .phase-metric-value {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
    }

    .card {
      background: #ffffff;
      border-radius: 12px;
      border: 1px solid var(--line);
      overflow: hidden;
    }
    .card + .card { margin-top: 16px; }
    .card-header {
      padding: 20px;
      border-bottom: 1px solid var(--line);
    }
    .card-header h3 {
      font-size: 15px;
      font-weight: 600;
      margin: 0 0 8px 0;
    }
    .card-header p {
      font-size: 13px;
      color: var(--muted);
      margin: 0;
    }
    .card-body { padding: 20px; }

    .dropzone {
      border: 2px dashed #d1d5db;
      border-radius: 12px;
      padding: 36px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: linear-gradient(135deg, #fafcff 0%, #ffffff 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .dropzone:hover,
    .dropzone.dragover {
      border-color: var(--brand);
      background: #f0f2ff;
    }
    .dropzone.validation:hover,
    .dropzone.validation.dragover {
      border-color: #ca8a04;
      background: #fefce8;
    }
    .dropzone input { display: none; }
    .dropzone > svg {
      margin: 0 auto;
    }
    .drop-title {
      font-size: 14px;
      font-weight: 500;
      margin: 12px 0 4px;
    }
    .drop-subtitle {
      font-size: 12px;
      color: var(--faint);
    }

    .ingest-layout {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 16px;
    }
    .requirement-panel { grid-column: span 7; }
    .config-panel { grid-column: span 5; }
    .upload-panel { grid-column: 1 / -1; }
    .requirement-dialog,
    .experiment-config,
    .upload-stage-card {
      padding: 18px;
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 14px;
    }
    .requirement-dialog {
      background: linear-gradient(180deg, #ffffff 0%, #fafcff 100%);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .panel-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .panel-lead {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      min-width: 0;
    }
    .requirement-avatar {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: #1f2937;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .requirement-content {
      flex: 1;
      min-width: 0;
    }
    .panel-eyebrow {
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .requirement-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }
    .requirement-hint {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.6;
    }
    .requirement-textarea {
      width: 100%;
      min-height: 142px;
      resize: vertical;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #ffffff;
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
      outline: none;
    }
    .requirement-textarea:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.12);
    }
    .requirement-example {
      font-size: 12px;
      color: var(--faint);
      line-height: 1.5;
    }
    .requirement-confirmed {
      margin-top: 10px;
      padding: 8px 10px;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 6px;
      color: #166534;
      font-size: 12px;
      font-weight: 500;
    }
    .config-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }
    .config-header-lead {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      min-width: 0;
    }
    .config-icon-wrap {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: rgba(102, 126, 234, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .config-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }
    .config-title-text {
      line-height: 1.3;
    }
    .config-subtitle {
      font-size: 12px;
      color: var(--muted);
    }
    .config-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }
    .metric-target-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(128px, 160px);
      gap: 12px;
    }
    .config-inline {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .config-field {
      min-width: 0;
    }
    .config-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #4b5563;
      margin-bottom: 6px;
    }
    .config-input,
    .config-select {
      width: 100%;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0 12px;
      background: #ffffff;
      color: var(--text);
      outline: none;
    }
    .config-input:focus,
    .config-select:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.12);
    }
    .config-input.invalid,
    .config-select.invalid {
      border-color: #f59e0b;
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.12);
      background: #fffdf6;
    }
    .input-suffix {
      position: relative;
    }
    .input-suffix .config-input {
      padding-right: 44px;
    }
    .input-suffix span {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      pointer-events: none;
    }
    .field-meta {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-top: 6px;
      flex-wrap: wrap;
    }
    .field-hint,
    .field-error {
      font-size: 12px;
      line-height: 1.45;
    }
    .field-hint { color: var(--faint); }
    .field-error {
      color: #b45309;
      font-weight: 600;
    }
    .config-chip {
      display: inline-flex;
      align-items: center;
      padding: 5px 10px;
      border-radius: 999px;
      background: #eef2ff;
      color: #4338ca;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .loading-box {
      margin-top: 12px;
      padding: 12px 16px;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      color: #1e40af;
      font-weight: 500;
    }
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid #93c5fd;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      flex-shrink: 0;
    }

    .suggestion {
      padding: 20px;
      margin-bottom: 16px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .suggestion-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .suggestion-text {
      font-size: 13px;
      color: #4b5563;
      line-height: 1.6;
      margin-bottom: 12px;
    }
    .inline-code {
      background: #fef3c7;
      color: #92400e;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 12px;
    }
    .button-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .secondary-button {
      padding: 8px 16px;
      background: #f3f4f6;
      color: #4b5563;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .small-primary {
      padding: 8px 16px;
      background: var(--brand);
      color: #ffffff;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .small-primary:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .small-primary:disabled:hover {
      opacity: 0.55;
      transform: none;
    }

    .upload-stage-card {
      display: grid;
      gap: 14px;
      background: linear-gradient(180deg, #ffffff 0%, #fafcff 100%);
    }
    .upload-status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .micro-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;

    function icon(name, size = 20, color = "currentColor", strokeWidth = 2) {

    function setState(patch) {
      Object.assign(state, patch);
      render();

    function htmlEscape(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function cloneExperiments(loops) {
      return loops.map(loop => ({
        ...loop,
        components: loop.components.map(component => ({ ...component }))
      }));
    }

    function activeLoop() {
      return state.experimentLoops.find(loop => loop.id === state.activeLoopId) || state.experimentLoops[state.experimentLoops.length - 1];
    }

    function validationErrors() {
      const errors = {};
      const roundsRaw = String(state.experimentRoundsInput ?? "").trim();
      const roundsNum = Number(roundsRaw);
      if (!roundsRaw) {
        errors.experimentRounds = "请输入 1 到 8 之间的整数轮次。";
      } else if (!Number.isInteger(roundsNum) || roundsNum < 1 || roundsNum > 8) {
        errors.experimentRounds = "请输入 1 到 8 之间的整数轮次。";
      }

      const ratioRaw = String(state.validationRatioInput ?? "").trim();
      const ratioNum = Number(ratioRaw);
      if (!ratioRaw) {
        errors.validationRatio = "请输入 5 到 100 之间的数值，系统将显示为百分比。";
      } else if (!Number.isFinite(ratioNum) || ratioNum < 5 || ratioNum > 100) {
        errors.validationRatio = "请输入 5 到 100 之间的数值，系统将显示为百分比。";
      }

      const targetRaw = String(state.optimizationTargetInput ?? "").trim();
      const targetNum = Number(targetRaw);
      if (!targetRaw) {
        errors.optimizationTarget = "目标值需在 0 到 1 之间，例如 0.95。";
      } else if (!Number.isFinite(targetNum) || targetNum < 0 || targetNum > 1) {
        errors.optimizationTarget = "目标值需在 0 到 1 之间，例如 0.95。";
      }

      return errors;
    }

    function isConfigValid() {
      const errors = validationErrors();
      return !errors.experimentRounds && !errors.validationRatio && !errors.optimizationTarget;
    }

    function formatMetricTarget() {
      return Number(state.optimizationTarget).toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
    }

    function stageProgress() {
      const configDone = isConfigValid();
      const hasRequirement = Boolean(state.modelingRequirement.trim());
      const hasFile = Boolean(state.uploadedFile);
      const parsed = hasFile && !state.isProcessing;
      const loops = state.experimentLoops.length;
      const active = activeLoop();
      const successCount = state.experimentLoops.filter(loop => loop.status === "success").length;
      const deployReady = state.currentStep >= 2;

      return [
        {
          id: 0,
          percent: parsed && configDone ? (hasRequirement ? 100 : 85) : hasFile || hasRequirement ? 55 : 20,
          statusText: parsed ? (hasRequirement ? "已就绪" : "待提交需求") : hasFile ? "正在解析" : "待上传",
          badge: parsed ? (hasRequirement ? "success" : "process") : hasFile ? "process" : "pending"
        },
        {
          id: 1,
          percent: state.currentStep === 0 ? 0 : Math.min(100, Math.round((loops / Math.max(1, Number(state.experimentRounds) || 1)) * 100)),
          statusText: state.currentStep === 0 ? "未开始" : `已完成 ${loops} 轮`,
          badge: state.currentStep > 1 ? "success" : state.currentStep === 1 ? "process" : "pending",
          successCount
        },
        {
          id: 2,
          percent: deployReady ? 100 : state.currentStep >= 1 ? 68 : 0,
          statusText: deployReady ? "可交付" : state.currentStep >= 1 ? "等待确认" : "未开始",
          badge: deployReady ? "success" : state.currentStep >= 1 ? "process" : "pending",
          activeModel: active?.name || "05 Loop"
        }
      ];
    }

    function progressWidth(value) {
      return Math.max(0, Math.min(100, value));
    }

    function currentPhaseSummary() {
      const progress = stageProgress();
      const current = progress[state.currentStep];
      if (state.currentStep === 0) {
        return {
          kicker: "阶段 1 / 数据接入",
          title: "先明确建模要求，再完成自动实验配置与文件上传",

          metrics: [

      if (state.currentStep === 1) {

          percent: current.percent,

            { label: "成功 Loop", value: `${current.successCount || 0}` },
            { label: `最佳 ${state.optimizationMetric}`, value: best.auc.toFixed(4) },
            { label: "部署候选", value: best.name }
          ]
        };
      }
      return {
        kicker: "阶段 3 / 模型部署",
        title: "模型交付已就绪，聚焦最终导出与上线交接",

        percent: current.percent,
        metrics: [
          { label: "最佳方案", value: current.activeModel || "05 Loop" },
          { label: "目标指标", value: `${state.optimizationMetric} ${formatMetricTarget()}` },
          { label: "验证比例", value: `${state.validationRatio}%` },
          { label: "交付状态", value: "已准备就绪" }
        ]
      };
    }

    function experimentRows() {
      const rows = state.experimentLoops.flatMap(loop => loop.components.map(component => ({ loop, component })));
      return state.successfulOnly ? rows.filter(row => row.component.status === "success") : rows;
    }

    function createNextLoop() {
      return createGeneratedLoop(state.experimentLoops.length + 1);
    }

    function configuredExperimentLoops() {
      const count = Math.max(1, Math.min(8, Number(state.experimentRounds) || 5));
      const loops = cloneExperiments(defaultExperimentLoops.slice(0, Math.min(count, defaultExperimentLoops.length)));
      while (loops.length < count) {
        loops.push(createGeneratedLoop(loops.length + 1));
      }
      return loops;
    }

    function createGeneratedLoop(id) {
      const padded = String(id).padStart(2, "0");
      const isSuccess = id % 3 !== 0;
      const auc = isSuccess ? 0.8542 + (id - 5) * 0.0021 : 0.8460 - id * 0.0006;
      return {
        id,
        name: `${padded} Loop`,
        status: isSuccess ? "success" : "failed",
        summary: isSuccess
          ? "新增实验验证了稳定特征筛选和阈值校准策略，模型排序能力小幅提升。"
          : "新增实验尝试更激进的组合特征，但验证集收益不足，已记录为排除项。",
        auc,
        ks: isSuccess ? 0.6234 + (id - 5) * 0.004 : 0.5980,
        components: [
          {
            id: `${id}-feature`,
            order: String(id * 2).padStart(2, "0"),
            type: "FeatureEng",
            status: isSuccess ? "success" : "failed",
            hypothesis: isSuccess
              ? "基于成功假设继续筛选稳定业务特征，并移除低贡献字段。"
              : "尝试加入更复杂的高阶交叉特征以捕捉非线性风险模式。",
            evidence: isSuccess
              ? "验证集 AUC 小幅提升，特征解释保持一致。"
              : "训练集提升但验证集波动扩大，泛化收益不足。",
            metric: isSuccess ? "+0.21 AUC" : "-0.82 AUC"
          },
          {
            id: `${id}-model`,
            order: String(id * 2 + 1).padStart(2, "0"),
            type: isSuccess ? "Workflow" : "Model",
            status: "success",
            hypothesis: isSuccess
              ? "将成功特征固化进可复用建模工作流，作为后续部署输入。"
              : "使用更强正则化约束复杂特征对模型的影响。",
            evidence: isSuccess
              ? "工作流执行成功，可进入报告分析和部署交付。"
              : "训练可完成，但整体方案不进入最终推荐。", 
            metric: isSuccess ? "稳定" : "可训练"
          }
        ]
      };
    }

              const phase = progress[index];
              return `

                  <div class="step-head">
                    <div class="step-icon-box ${isDone ? "done" : ""} ${isActive ? "active" : ""}">

                    </div>
                    <div class="step-copy">
                      <div class="step-index">Stage 0${index + 1}</div>
                      <div class="step-label ${isActive ? "active" : ""}">${step.name}</div>
                      <div class="step-desc">${step.desc}</div>

                  </div>
                  <div class="step-meta">
                    <span class="step-percent">${phase.percent}%</span>

                  </div>
                </div>
              `;
            }).join("")}
          </div>
          <div class="progress">
            <div class="progress-fill" style="width: ${overall}%"></div>
          </div>
        </div>
      `;

        hint = "请先上传或拖拽数据文件；解析完成后，点击「提交需求」即可进入多轮自动实验（建议同时填写上方建模要求）。";

      document.querySelectorAll("[data-chat]").forEach(item => {
        item.addEventListener("click", () => setState({ selectedChat: item.dataset.chat }));
      });

      document.querySelector("[data-action='new-chat']")?.addEventListener("click", () => {
        setState({
          currentStep: 0,
          uploadedFile: null,
          modelingRequirement: "",
          requirementSubmitted: false,
          experimentRounds: 5,
          experimentRoundsInput: "5",
          optimizationMetric: "AUC",
          optimizationTarget: 0.95,
          optimizationTargetInput: "0.95",
          validationRatio: 20,
          validationRatioInput: "20",
          experimentView: "result",
          successfulOnly: false,
          activeLoopId: 5,
          expandedExperimentId: null,
          experimentLoops: cloneExperiments(defaultExperimentLoops),
          isProcessing: false,
          selectedChat: "欺诈交易建模-05"
        });
      });

      document.getElementById("modeling-requirement")?.addEventListener("input", event => {
        setState({
          modelingRequirement: event.target.value,
          requirementSubmitted: false
        });
      });

      document.querySelector("[data-action='submit-requirement']")?.addEventListener("click", event => {
        const btn = event.currentTarget;
        if (btn.disabled) return;
        if (!state.uploadedFile || state.isProcessing) return;
        const ta = document.getElementById("modeling-requirement");
        const value = (ta?.value ?? "").trim();
        const loops = configuredExperimentLoops();
        setState({
          modelingRequirement: value,
          requirementSubmitted: Boolean(value),
          currentStep: 1,
          experimentLoops: loops,
          activeLoopId: loops[loops.length - 1]?.id || 1,
          experimentView: "result",
          successfulOnly: false,
          expandedExperimentId: null
        });
      });

      bindConfigInput("optimization-metric", "optimizationMetric");
      bindValidatedNumberInput("experiment-rounds", {
        rawKey: "experimentRoundsInput",
        valueKey: "experimentRounds",
        normalize: value => {
          const num = Number(value);
          return Number.isInteger(num) && num >= 1 && num <= 8 ? num : state.experimentRounds;
        }
      });
      bindValidatedNumberInput("validation-ratio", {
        rawKey: "validationRatioInput",
        valueKey: "validationRatio",
        normalize: value => {
          const num = Number(value);
          return Number.isFinite(num) && num >= 5 && num <= 100 ? num : state.validationRatio;
        }
      });
      bindValidatedNumberInput("optimization-target", {
        rawKey: "optimizationTargetInput",
        valueKey: "optimizationTarget",
        normalize: value => {
          const num = Number(value);
          return Number.isFinite(num) && num >= 0 && num <= 1 ? num : state.optimizationTarget;
        }
      });

      document.querySelectorAll("[data-action='experiment-view']").forEach(button => {
        button.addEventListener("click", () => setState({ experimentView: button.dataset.view }));
      });

      document.querySelector("[data-action='toggle-successful']")?.addEventListener("click", () => {
        setState({ successfulOnly: !state.successfulOnly, expandedExperimentId: null });
      });

      document.querySelectorAll("[data-action='select-loop']").forEach(button => {
        button.addEventListener("click", () => {
          setState({ activeLoopId: Number(button.dataset.loopId), experimentView: "process", expandedExperimentId: null });
        });
      });

      document.querySelectorAll("[data-action='toggle-experiment']").forEach(button => {
        button.addEventListener("click", () => {
          const id = button.dataset.experimentId;
          setState({ expandedExperimentId: state.expandedExperimentId === id ? null : id });
        });
      });

      document.querySelector("[data-action='add-loop']")?.addEventListener("click", () => {
        const nextLoop = createNextLoop();
        setState({
          experimentLoops: [...state.experimentLoops, nextLoop],
          activeLoopId: nextLoop.id,
          experimentView: "process",
          successfulOnly: false,
          expandedExperimentId: null
        });
      });

      document.querySelectorAll("[data-action='go-deploy']").forEach(button => {
        button.addEventListener("click", () => setState({ currentStep: 2 }));
      });

      document.getElementById("file-upload-2")?.addEventListener("change", event => {
        const file = event.target.files[0];
        if (!file) return;
        handleFileUpload(file.name);
      });

      document.querySelectorAll("[data-dropzone]").forEach(zone => {
        zone.addEventListener("dragover", event => {
          event.preventDefault();
          zone.classList.add("dragover");
        });
        zone.addEventListener("dragleave", () => zone.classList.remove("dragover"));
        zone.addEventListener("drop", event => {
          event.preventDefault();
          zone.classList.remove("dragover");
          const file = event.dataTransfer.files[0];
          if (!file) return;
          handleFileUpload(file.name);
        });
      });
    }

    function bindConfigInput(id, key) {
      document.getElementById(id)?.addEventListener("input", event => {
        const patch = { [key]: event.target.value };
        if (id === "optimization-metric") {
          const nextPlaceholder = metricPlaceholders[event.target.value] || "";
          if (!state.optimizationTargetInput.trim()) {
            patch.optimizationTargetInput = nextPlaceholder;
            patch.optimizationTarget = Number(nextPlaceholder) || 0;
          }
        }
        setState(patch);
      });
    }

    function bindValidatedNumberInput(id, config) {
      document.getElementById(id)?.addEventListener("input", event => {
        const rawValue = event.target.value;
        const patch = { [config.rawKey]: rawValue };
        const normalized = config.normalize(rawValue);
        if (rawValue.trim()) {
          patch[config.valueKey] = normalized;
        }
        setState(patch);
      });
    }

    function handleFileUpload(fileName) {
      setState({ uploadedFile: fileName, isProcessing: true, requirementSubmitted: false });
      window.setTimeout(() => {
        setState({
          isProcessing: false
        });
      }, 2000);
    }

    function render() {
      document.getElementById("app").innerHTML = `
        ${sidebarTemplate()}
        ${mainTemplate()}
      `;
      bindEvents();
    }

    render();
  </script>
</body>
</html>
